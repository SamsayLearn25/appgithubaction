name: Python CI

# when you got event of push or pull on branches main
on:
  push:
    branches:
        - main
  pull_request:
    branches: 
        - main

jobs:
    test:
        runs-on: ubuntu-latest # run on ubuntu container

        steps:

            - name: check out code
              uses: actions/checkout@v2

            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.8'

            - name: Install dependencies
              run:
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run tests
              run:
                pytest

